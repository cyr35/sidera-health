<!DOCTYPE html>

<head>

  <meta name="description" content="We guide healthcare and medical device companies through international expansion — from regulatory pathways to distribution networks in LATAM and Europe.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Sidera Health — Market Expansion for Healthcare">
  <meta property="og:description" content="Strategic partners for healthcare companies going global.">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚕️</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css?v=2">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">Sidera<span>.</span>Health</a>
      
      <button class="mobile-menu-btn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="#about" data-content="nav.about"></a></li>
          <li><a href="#services" data-content="nav.services"></a></li>
          <li><a href="#markets" data-content="nav.markets"></a></li>
          <li><a href="#insights" data-content="nav.insights"></a></li>
          <li><a href="#contact" data-content="nav.contact"></a></li>
        </ul>
        
        <div class="lang-toggle">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-container">
      <div class="hero-content">
        <div class="hero-badge">
          <span class="badge-dot"></span>
          <span data-content="hero.badge"></span>
        </div>
        
        <h1 data-content="hero.title"></h1>
        
        <p class="hero-sub" data-content="hero.subtitle"></p>
        
        <div class="hero-buttons">
          <a href="#contact" class="btn-primary" data-content="hero.cta1"></a>
          <a href="#services" class="btn-secondary" data-content="hero.cta2"></a>
        </div>
      </div>
      
      <div class="hero-image">
        <div class="hero-image-wrapper">
          <img src="/img/hero-doctor.jpg" alt="Medical professional with advanced surgical equipment" loading="eager">
        </div>
      </div>
    </div>
  </section>

  <!-- About -->
  <section id="about" class="about">
    <div class="container">
      <div class="section-header">
        <span class="section-eyebrow" data-content="about.eyebrow"></span>
        <h2 data-content="about.title"></h2>
      </div>
      
      <div class="about-grid">
        <div class="about-text">
          <p data-content="about.paragraph1"></p>
          
          <div class="stats">
            <div class="stat">
              <span class="stat-number" data-content="about.stat1.number"></span>
              <span class="stat-label" data-content="about.stat1.label"></span>
            </div>
            <div class="stat">
              <span class="stat-number" data-content="about.stat2.number"></span>
              <span class="stat-label" data-content="about.stat2.label"></span>
            </div>
            <div class="stat">
              <span class="stat-number" data-content="about.stat3.number"></span>
              <span class="stat-label" data-content="about.stat3.label"></span>
            </div>
          </div>
        </div>
        
        <div class="about-quote">
          <blockquote>
            <p data-content="about.quote"></p>
          </blockquote>
          <p class="quote-attribution" data-content="about.quoteAuthor"></p>
        </div>
      </div>
      
      <div class="about-strip">
        <img src="/img/about-equipment.jpg" alt="Medical device equipment" loading="lazy">
        <img src="/img/about-meeting.jpg" alt="Healthcare business meeting" loading="lazy">
        <img src="/img/about-surgical.jpg" alt="Surgical procedure" loading="lazy">
      </div>
    </div>
  </section>

  <!-- Services -->
  <section id="services" class="services">
    <div class="container">
      <div class="section-header center">
        <span class="section-eyebrow" data-content="services.eyebrow"></span>
        <h2 data-content="services.title"></h2>
      </div>
      
      <div class="services-grid">
        <div class="service-card">
          <span class="service-number">01</span>
          <h3 data-content="services.service1.title"></h3>
          <p data-content="services.service1.desc"></p>
        </div>
        
        <div class="service-card">
          <span class="service-number">02</span>
          <h3 data-content="services.service2.title"></h3>
          <p data-content="services.service2.desc"></p>
        </div>
        
        <div class="service-card">
          <span class="service-number">03</span>
          <h3 data-content="services.service3.title"></h3>
          <p data-content="services.service3.desc"></p>
        </div>
        
        <div class="service-card">
          <span class="service-number">04</span>
          <h3 data-content="services.service4.title"></h3>
          <p data-content="services.service4.desc"></p>
        </div>
        
        <div class="service-card">
          <span class="service-number">05</span>
          <h3 data-content="services.service5.title"></h3>
          <p data-content="services.service5.desc"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Feature Block -->
  <div class="feature-block">
    <div class="feature-image">
      <img src="/img/feature-device.jpg" alt="Medical device technology" loading="lazy">
    </div>
    <div class="feature-content">
      <span class="section-eyebrow" data-content="feature.eyebrow"></span>
      <h2 data-content="feature.title"></h2>
      <p data-content="feature.desc"></p>
      <ul class="feature-list">
        <li><span class="feature-dot"></span><span data-content="feature.item1"></span></li>
        <li><span class="feature-dot"></span><span data-content="feature.item2"></span></li>
        <li><span class="feature-dot"></span><span data-content="feature.item3"></span></li>
      </ul>
    </div>
  </div>

  <!-- Markets -->
  <section id="markets" class="markets">
    <div class="container">
      <div class="section-header">
        <span class="section-eyebrow" data-content="markets.eyebrow"></span>
        <h2 data-content="markets.title"></h2>
      </div>
      
      <div class="markets-grid">
        <div class="market-card">
          <img src="/img/market-latam.jpg" alt="Latin America healthcare market" loading="lazy">
          <div class="market-overlay">
            <span class="market-tag" data-content="markets.latam.tag"></span>
            <h3 data-content="markets.latam.title"></h3>
            <p data-content="markets.latam.desc"></p>
          </div>
        </div>
        
        <div class="market-card">
          <img src="/img/market-europe.jpg" alt="European healthcare market" loading="lazy">
          <div class="market-overlay">
            <span class="market-tag" data-content="markets.europe.tag"></span>
            <h3 data-content="markets.europe.title"></h3>
            <p data-content="markets.europe.desc"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Insights -->
  <section id="insights" class="insights">
    <div class="container">
      <div class="section-header">
        <div>
          <span class="section-eyebrow" data-content="insights.eyebrow"></span>
          <h2 data-content="insights.title"></h2>
        </div>
        <a href="#" class="view-all" data-content="insights.viewAll"></a>
      </div>
      
      <div class="insights-grid">
        <article class="insight-card featured">
          <div class="insight-image">
            <img src="/img/news-mdr.jpg" alt="EU MDR regulations" loading="lazy">
          </div>
          <div class="insight-content">
            <span class="insight-tag" data-content="insights.article1.tag"></span>
            <h3 data-content="insights.article1.title"></h3>
            <p data-content="insights.article1.desc"></p>
            <div class="insight-meta">
              <span data-content="insights.article1.date"></span>
              <span class="insight-arrow">→</span>
            </div>
          </div>
        </article>
        
        <article class="insight-card">
          <div class="insight-image">
            <img src="/img/news-anvisa.jpg" alt="ANVISA Brazil" loading="lazy">
          </div>
          <div class="insight-content">
            <span class="insight-tag" data-content="insights.article2.tag"></span>
            <h3 data-content="insights.article2.title"></h3>
            <p data-content="insights.article2.desc"></p>
            <div class="insight-meta">
              <span data-content="insights.article2.date"></span>
              <span class="insight-arrow">→</span>
            </div>
          </div>
        </article>
        
        <article class="insight-card">
          <div class="insight-image">
            <img src="/img/news-ai.jpg" alt="AI medical devices" loading="lazy">
          </div>
          <div class="insight-content">
            <span class="insight-tag" data-content="insights.article3.tag"></span>
            <h3 data-content="insights.article3.title"></h3>
            <p data-content="insights.article3.desc"></p>
            <div class="insight-meta">
              <span data-content="insights.article3.date"></span>
              <span class="insight-arrow">→</span>
            </div>
          </div>
        </article>

    </div>

    <div class="container">
      <div class="section-header center">
        <span class="section-eyebrow" data-content="testimonials.eyebrow"></span>
        <h2 data-content="testimonials.title"></h2>
      </div>
      
      <div class="testimonials-grid">
        <div class="testimonial-card">
          <div class="quote-mark">"</div>
          <p data-content="testimonials.client1.text"></p>
          <div class="testimonial-author">
            <strong data-content="testimonials.client1.name"></strong>
            <span data-content="testimonials.client1.role"></span>
            <small data-content="testimonials.client1.company"></small>

        </div>
        
        <div class="testimonial-card">
          <div class="quote-mark">"</div>
          <p data-content="testimonials.client2.text"></p>

            <span data-content="testimonials.client2.role"></span>
            <small data-content="testimonials.client2.company"></small>
          </div>
        </div>

    </div>

  <section id="contact" class="contact">
    <div class="container">
      <div class="contact-content">
        <span class="section-eyebrow" data-content="contact.eyebrow"></span>

        <p data-content="contact.desc"></p>
        <a href="mailto:hello@siderahealth.com" class="btn-primary">hello@siderahealth.com</a>

    </div>
  </section>

      <div>
        <div class="footer-logo">Sidera<span>.</span>Health</div>
        <p class="footer-copyright" data-content="footer.copyright"></p>
      </div>
      <ul class="footer-links">
        <li><a href="#about" data-content="footer.about"></a></li>
        <li><a href="#services" data-content="footer.services"></a></li>
        <li><a href="#markets" data-content="footer.markets"></a></li>
        <li><a href="#insights" data-content="footer.insights"></a></li>
        <li><a href="#contact" data-content="footer.contact"></a></li>
      </ul>
    </div>
  </footer>
