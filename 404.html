<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Sidera Health</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F7F5F0;
      color: #1A1A18;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 500px; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 6rem; font-weight: 300; color: #C8A96E; margin-bottom: 1rem; }
    h2 { font-size: 1.5rem; font-weight: 400; margin-bottom: 1rem; }
    p { color: #3D3D38; margin-bottom: 2rem; }
    a { display: inline-block; padding: 0.8rem 2rem; background: #1A1A18; color: white; text-decoration: none; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; transition: background 0.2s; }
    a:hover { background: #C8A96E; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you are looking for doesn't exist or has been moved.</p>
    <a href="/">← Back to home</a>
  </div>
</body>
</html>
